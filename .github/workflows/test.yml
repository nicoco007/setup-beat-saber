name: Test

on:
  push:
    branches:
      - main
      - next
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install packages
        run: npm install

      - name: Check build is up-to-date
        run: |
          npm run build
          git diff --exit-code -- dist/index.js

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Run tests
        run: npm test